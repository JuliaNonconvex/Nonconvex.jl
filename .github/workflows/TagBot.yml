name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
