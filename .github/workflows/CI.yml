name: Installation
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.group }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        group:
          - NonconvexIpopt
          - NonconvexNLopt
          - NonconvexJuniper
          - NonconvexMMA
          - NonconvexPavito
          - NonconvexBayesian
          - NonconvexAugLagLab
          - NonconvexSemidefinite
          - NonconvexSearch
          - NonconvexTOBS
          - NonconvexMetaheuristics
          - NonconvexNOMAD
          - NonconvexMultistart
          - NonconvexPercival
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      # Pkg.test is not used: its sandbox load path excludes the standard
      # libraries (Pkg, Random, ...) that the tests and the generated @load
      # code rely on. Julia 1.13 rejects package images built with different
      # --check-bounds settings, so every phase (buildpkg, precompile, the
      # test run and the Pkg.add precompiles that @load triggers) runs with
      # the default flags to keep the package images compatible.
      - name: Instantiate and precompile the test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=".")); Pkg.instantiate(); Pkg.precompile()'
      - name: Run tests
        env:
          GROUP: ${{ matrix.group }}
        run: julia --project=test --color=yes --depwarn=yes --code-coverage=@. test/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
