name: Documentation

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  docs:
    name: "Build and deploy docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v2
        with:
          cache-name: docs
          cache-artifacts: true
          cache-packages: true
          cache-compiled: true
      - name: Use General git registry (avoids CDN lag for new versions)
        run: |
          rm -rf ~/.julia/registries/General.toml ~/.julia/registries/General.tar.gz
          julia -e 'using Pkg; Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaRegistries/General.git"))'
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.precompile()'
      - name: Build docs with DocumenterFragments
        run: julia --project=docs --color=yes docs/make.jl
      - name: Deploy dev docs (push to master)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          destination_dir: dev
          keep_files: true
      - name: Deploy stable docs (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          destination_dir: stable
          keep_files: true
      - name: Deploy PR preview docs (pull request)
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          destination_dir: preview/PR${{ github.event.pull_request.number }}
          keep_files: true
      - name: Post preview URL comment
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            📖 PR preview docs: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/PR${{ github.event.pull_request.number }}/
          comment_tag: preview-docs
